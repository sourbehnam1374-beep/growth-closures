name: Verify trilogy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-trilogy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned verification dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Compile verifier sources
        run: python -m compileall -q verifiers
      - name: Run fixed ledgers
        run: |
          python verifiers/growth_check.py
          python verifiers/delete_growth.py
          python verifiers/verify_o1_necessity.py
          python verifiers/verify_unified.py
      - name: Run property and anomaly suites
        run: |
          python verifiers/test_growth_properties.py
          python -m pytest -q verifiers/test_delete_properties.py
          python verifiers/test_anomaly_characterization.py
      - name: Verify optional bridge and product prototypes when present
        run: |
          if [ -f verifiers/verify_invariance_bridge.py ]; then python verifiers/verify_invariance_bridge.py; fi
          if [ -f verifiers/verify_kernel_provenance.py ]; then python verifiers/verify_kernel_provenance.py; fi
          if [ -f verifiers/test_stronger_properties.py ]; then python -m pytest -q verifiers/test_stronger_properties.py; fi
          if [ -f verifiers/proofgraph_v0.py ]; then python verifiers/proofgraph_v0.py; fi

  lean:
    name: Lean 4.30.0 kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Elan and Lean toolchain
        env:
          ELAN_INSTALLER_COMMIT: 6737edca3d2ca3dbaa1b47b87769b48b420633ae
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_INSTALLER_COMMIT}/elan-init.sh" \
            --output "${RUNNER_TEMP}/elan-init.sh"
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  ${RUNNER_TEMP}/elan-init.sh" \
            | sha256sum --check --strict
          sh "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Reject trust-expanding source tokens
        run: python3 verifiers/verify_lean_hygiene.py
      - name: Compile and capture the axiom audit
        run: |
          set -o pipefail
          lean --version
          lean lean/GrowthClosure.lean | tee "${RUNNER_TEMP}/lean-audit.txt"
      - name: Enforce the reported axiom boundary
        run: |
          if grep -F "Classical.choice" "${RUNNER_TEMP}/lean-audit.txt"; then
            echo "Unexpected Classical.choice dependency"
            exit 1
          fi
          if grep -E "declaration uses '(sorry|admit)'" "${RUNNER_TEMP}/lean-audit.txt"; then
            echo "Unexpected incomplete declaration"
            exit 1
          fi
